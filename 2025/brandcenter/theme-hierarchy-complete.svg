  <text class="indent2" x="65" y="1025">errorBackground: string</text>
  <text class="type" x="220" y="1025">// Error background</text>
  
  <line class="tree-connector" x1="40" y1="1040" x2="60" y2="1040" />
  <text class="indent2" x="65" y="1045">warningBackground: string</text>
  <text class="type" x="230" y="1045">// Warning background</text>
  
