  <text class="indent2" x="65" y="1115">tiny, xSmall, small, smallPlus: IRawStyle</text>
  
  <line class="tree-connector" x1="40" y1="1130" x2="60" y2="1130" />
  <text class="indent2" x="65" y="1135">medium, mediumPlus, large: IRawStyle</text>
  
  <line class="tree-connector" x1="40" y1="1150" x2="60" y2="1150" />
  <text class="indent2" x="65" y="1155">xLarge, xxLarge, superLarge, mega: IRawStyle</text>
  
