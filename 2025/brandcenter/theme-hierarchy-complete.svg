  <line class="tree-connector" x1="40" y1="660" x2="60" y2="660" />
  <text class="indent2" x="65" y="665">bodyBackground: string</text>
  <text class="type" x="220" y="665">// Main background</text>
  
  <line class="tree-connector" x1="40" y1="680" x2="60" y2="680" />
  <text class="indent2" x="65" y="685">bodyText: string</text>
  <text class="type" x="160" y="685">// Main text color</text>
  
  <line class="tree-connector" x1="40" y1="700" x2="60" y2="700" />
  <text class="indent2" x="65" y="705">bodyTextChecked: string</text>
  <text class="type" x="220" y="705">// Checked text color</text>
  
  <line class="tree-connector" x1="40" y1="720" x2="60" y2="720" />
  <text class="indent2" x="65" y="725">bodySubtext: string</text>
  <text class="type" x="180" y="725">// Secondary text</text>
  
  <line class="tree-connector" x1="40" y1="740" x2="60" y2="740" />
  <text class="indent2" x="65" y="745">bodyFrameBackground: string</text>
  <text class="type" x="250" y="745">// Frame background</text>
  
  <line class="tree-connector" x1="40" y1="760" x2="60" y2="760" />
  <text class="indent2" x="65" y="765">bodyFrameDivider: string</text>
  <text class="type" x="220" y="765">// Frame divider</text>
  
  <!-- Link Colors -->
  <line class="tree-connector" x1="40" y1="790" x2="60" y2="790" />
  <text class="indent2" x="65" y="795">link: string</text>
  <text class="type" x="130" y="795">// Link color</text>
  
  <line class="tree-connector" x1="40" y1="810" x2="60" y2="810" />
  <text class="indent2" x="65" y="815">linkHovered: string</text>
  <text class="type" x="175" y="815">// Link hover color</text>
  
  <!-- Button Colors -->
  <line class="tree-connector" x1="40" y1="840" x2="60" y2="840" />
  <text class="indent2" x="65" y="845">primaryButtonBackground: string</text>
  <text class="type" x="280" y="845">// Primary button bg</text>
  
  <line class="tree-connector" x1="40" y1="860" x2="60" y2="860" />
  <text class="indent2" x="65" y="865">primaryButtonText: string</text>
  <text class="type" x="230" y="865">// Primary button text</text>
  
  <line class="tree-connector" x1="40" y1="880" x2="60" y2="880" />
  <text class="indent2" x="65" y="885">buttonBackground: string</text>
  <text class="type" x="220" y="885">// Button background</text>
  
  <line class="tree-connector" x1="40" y1="900" x2="60" y2="900" />
  <text class="indent2" x="65" y="905">buttonText: string</text>
  <text class="type" x="170" y="905">// Button text</text>
  
  <line class="tree-connector" x1="40" y1="920" x2="60" y2="920" />
  <text class="indent2" x="65" y="925">buttonBorder: string</text>
