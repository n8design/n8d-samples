  <!-- Right Side - Implementation Details -->
  <rect class="section-bg" x="800" y="90" width="780" height="1090" />
  <text class="subtitle" x="820" y="120">Implementation Guide</text>
  
  <!-- Usage Example -->
  <text class="indent1" x="820" y="150">Usage in BrandColorsWebPart:</text>
  <text class="indent2" x="840" y="175">// Access theme variant</text>
  <text class="indent2" x="840" y="195">const theme = this._themeVariant;</text>
  <text class="indent2" x="840" y="215">const primaryColor = theme.palette.themePrimary;</text>
  <text class="indent2" x="840" y="235">const textColor = theme.semanticColors.bodyText;</text>
  
  <!-- Common Properties -->
  <text class="indent1" x="820" y="280">Most Used Properties:</text>
  <text class="indent2" x="840" y="305">• palette.themePrimary</text>
  <text class="indent2" x="840" y="325">• palette.neutralPrimary</text>
  <text class="indent2" x="840" y="345">• semanticColors.bodyBackground</text>
  <text class="indent2" x="840" y="365">• semanticColors.bodyText</text>
  <text class="indent2" x="840" y="385">• semanticColors.link</text>
  
  <!-- Color Categories -->
  <text class="indent1" x="820" y="430">Color Categories:</text>
  
  <text class="indent2" x="840" y="460">Theme Colors (Brand):</text>
  <text class="indent3" x="860" y="480">• Primary: themePrimary → themeSecondary → themeTertiary</text>
  <text class="indent3" x="860" y="500">• Light: themeLight → themeLighter → themeLighterAlt</text>
  <text class="indent3" x="860" y="520">• Dark: themeDark → themeDarkAlt → themeDarker</text>
  
  <text class="indent2" x="840" y="560">Neutral Colors (Grayscale):</text>
  <text class="indent3" x="860" y="580">• Light: white → neutralLighterAlt → neutralLighter</text>
  <text class="indent3" x="860" y="600">• Medium: neutralLight → neutralQuaternary → neutralTertiary</text>
  <text class="indent3" x="860" y="620">• Dark: neutralSecondary → neutralPrimary → neutralDark → black</text>
  
  <text class="indent2" x="840" y="660">Semantic Colors (Contextual):</text>
  <text class="indent3" x="860" y="680">• Body: Background, text, subtext</text>
  <text class="indent3" x="860" y="700">• Interactive: Links, buttons</text>
  <text class="indent3" x="860" y="720">• Form: Input backgrounds, borders</text>
  <text class="indent3" x="860" y="740">• Status: Error, warning, success</text>
  
  <!-- Font Styles -->
  <text class="indent1" x="820" y="780">Font Styles:</text>
  <text class="indent2" x="840" y="805">Typography Scale:</text>
  <text class="indent3" x="860" y="825">tiny (10px) → xSmall (11px) → small (12px)</text>
  <text class="indent3" x="860" y="845">smallPlus (13px) → medium (14px) → mediumPlus (15px)</text>
  <text class="indent3" x="860" y="865">large (16px) → xLarge (18px) → xxLarge (20px)</text>
  <text class="indent3" x="860" y="885">superLarge (24px) → mega (28px)</text>
  
  <!-- Theme Provider Info -->
  <text class="indent1" x="820" y="930">Theme Provider Integration:</text>
  <text class="indent2" x="840" y="955">this._themeVariant is populated by:</text>
  <text class="indent3" x="860" y="975">• ThemeProvider.tryGetTheme()</text>
  <text class="indent3" x="860" y="995">• Automatic updates on theme changes</text>
  <text class="indent3" x="860" y="1015">• Available in all SPFx web parts</text>
  
  <!-- Best Practices -->
  <text class="indent1" x="820" y="1060">Best Practices:</text>
  <text class="indent2" x="840" y="1085">✓ Use semantic colors for UI elements</text>
  <text class="indent2" x="840" y="1105">✓ Use palette colors for brand elements</text>
  <text class="indent2" x="840" y="1125">✓ Check isInverted for dark mode</text>
  <text class="indent2" x="840" y="1145">✓ Subscribe to theme change events</text>
  <text class="indent2" x="840" y="1165">✓ Apply colors via CSS custom properties</text>
  
</svg>
