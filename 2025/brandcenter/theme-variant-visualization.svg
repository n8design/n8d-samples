  <!-- Properties Information -->
  <rect class="section-bg" x="20" y="460" width="1160" height="300" rx="8"/>
  <text class="subtitle" x="35" y="485">Theme Properties and Usage</text>
  
  <!-- Usage Examples -->
  <text class="property" x="50" y="510">✓ Accessible via:</text>
  <text class="value" x="160" y="510">this._themeVariant.palette.themePrimary</text>
  
  <text class="property" x="50" y="530">✓ Used in:</text>
  <text class="value" x="160" y="530">ThemeService.registerCSSVariables()</text>
  
  <text class="property" x="50" y="550">✓ Updated by:</text>
  <text class="value" x="160" y="550">_handleThemeChangedEvent()</text>
  
  <text class="property" x="50" y="580">Key Features:</text>
  <text class="value" x="50" y="600">• Readonly interface - cannot be modified directly</text>
  <text class="value" x="50" y="620">• Updated automatically when SharePoint theme changes</text>
  <text class="value" x="50" y="640">• Provides complete color palette for consistent UI</text>
  <text class="value" x="50" y="660">• Includes both palette colors and semantic colors</text>
  <text class="value" x="50" y="680">• Used by ThemeService to register CSS custom properties</text>
  
  <text class="property" x="600" y="510">Current Implementation:</text>
  <text class="value" x="600" y="530">• Consumed in BrandColorsWebPart.onInit()</text>
  <text class="value" x="600" y="550">• Passed to ColorRamp component for visualization</text>
  <text class="value" x="600" y="570">• Registered as CSS variables scoped to web part</text>
  <text class="value" x="600" y="590">• Provides theme-aware color management</text>
  
  <!-- Data Flow -->
  <text class="property" x="600" y="630">Data Flow:</text>
  <text class="value" x="600" y="650">ThemeProvider → _themeVariant → ThemeService → CSS Variables</text>
  <text class="value" x="600" y="670">ThemeChangedEvent → Update _themeVariant → Re-render</text>
  <text class="value" x="600" y="690">getPaletteColors(_themeVariant) → ColorRamp.render()</text>
  
  <!-- Footer -->
  <text class="property" x="20" y="790">SPFx Theme Integration - BrandColorsWebPart.ts</text>
